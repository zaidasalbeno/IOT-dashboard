<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm - Activity Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
</head>

<body>
    <a class="skip" href="#content">Skip to content</a>
    <div id="toastBox" class="toast-box"></div>

    <nav class="navbar navbar-expand-xl sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">Smart Farm</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li><a class="nav-link" href="main.html">Home</a></li>
                    <li><a class="nav-link" href="fields.html">Fields</a></li>
                    <li><a class="nav-link" href="storge.html">Storage</a></li>
                    <li><a class="nav-link" href="sort.html">Sorting</a></li>
                    <li><a class="nav-link" href="garage.html">Garage</a></li>
                    <li><a class="nav-link" href="robot.html">Robot</a></li>
                    <li><a class="nav-link" href="sensors.html">Sensors</a></li>
                    <li><a class="nav-link" href="reports.html">Reports</a></li>
                    <li><a class="nav-link" href="log.html">Activity</a></li>
                    <li><a class="nav-link" href="howtouse.html">Guide</a></li>
                </ul>

                <div class="d-flex gap-2 my-2">
                    <button class="btn btn-outline-secondary btn-sm" id="themeButton">Day / Night</button>
                    <button class="btn btn-outline-secondary btn-sm" id="logoutButton">Log out</button>
                </div>
            </div>
        </div>
    </nav>

    <header class="page-head py-5 text-center">
        <div class="container">
            <h1>Activity Log</h1>
            <p>Everything you did on the farm, saved in this browser.</p>
        </div>
    </header>

    <main class="container my-4">
        <div class="card p-3 mb-3 d-flex flex-row flex-wrap gap-2 align-items-center">
            <select id="filter" class="form-select w-auto">
                <option value="">All sections</option>
                <option>Fields</option>
                <option>Storage</option>
                <option>Sorting</option>
                <option>Garage</option>
                <option>Robot</option>
            </select>
            <span id="logCount" class="ms-auto"></span>
            <button id="clearLog" class="btn btn-outline-secondary btn-sm">Clear log</button>
        </div>

        <div class="table-responsive card">
            <table class="table mb-0">
                <thead><tr><th>Time</th><th>Section</th><th>What happened</th></tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </main>

    <footer class="text-center py-4">
        <p>Smart Farm</p>
    </footer>

    <template id="logRowTemplate">
        <tr>
            <td class="log-time"></td>
            <td class="log-section"></td>
            <td class="log-text"></td>
        </tr>
    </template>

    <template id="emptyLogTemplate">
        <tr><td colspan="3">Nothing here yet. Use the other pages and events will show up.</td></tr>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core/store.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/config/farm-data.js"></script>
    <script src="../js/pages/log.js"></script>
</body>

</html>
