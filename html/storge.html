<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm - Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
</head>

<body>
    <nav class="navbar"></nav>

    <header class="page-head py-5 text-center">
        <div class="container">
            <h1>Storage</h1>
            <p>Vents open and fans start when the storage gets too humid or too hot.</p>
        </div>
    </header>

    <main class="container my-4">
        <div class="status-card d-flex justify-content-between align-items-center p-4 mb-3">
            <div>
                <h5>Storage Status</h5>
                <span class="badge bg-success">Active</span>
            </div>
            <button id="act" class="btn btn-primary">Activate</button>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6"><div class="card p-3"><small>Temperature</small><div class="big" id="tempNow"></div><div class="bar mt-2"><i id="tempBar"></i></div></div></div>
            <div class="col-12 col-md-6"><div class="card p-3"><small>Humidity</small><div class="big" id="humNow"></div><div class="bar mt-2"><i id="humBar"></i></div></div></div>
        </div>

        <div class="row g-3 mb-3 text-center">
            <div class="col-6"><div class="card p-3"><div id="fan" class="fan mb-2"></div><strong id="fanText"></strong></div></div>
            <div class="col-6"><div class="card p-3"><div id="vent" class="vent mb-2"><i></i><i></i><i></i></div><strong id="ventText"></strong></div></div>
        </div>

        <div class="card p-3 d-flex flex-row flex-wrap gap-3 align-items-center">
            <label for="tempLimit">Fans on above (C)</label>
            <input id="tempLimit" type="number" class="form-control" style="width:80px">
            <label for="humLimit">Vents open above (%)</label>
            <input id="humLimit" type="number" class="form-control" style="width:80px">
        </div>
    </main>

    <footer class="text-center py-4">
        <p>Smart Farm</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core/store.js"></script>
    <script src="../js/core/layout.js"></script>
    <script src="../js/config/farm-data.js"></script>
    <script src="../js/core/switch.js"></script>
    <script src="../js/pages/storage.js"></script>
</body>

</html>
