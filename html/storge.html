<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IoT Dashboard - Storage</title>

    <link rel="stylesheet" href="../css/storge.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="main.html">
            IoT Dashboard
        </a>

        <a href="main.html" class="btn btn-light">
            ← Back to Home
        </a>

    </div>
</nav>


<main>

    <section class="storage-header">

        <div class="container">

            <h1>Storage</h1>

            <p>
                Monitor and control the storage environment.
            </p>

        </div>

    </section>


    <section class="py-5">

        <div class="container">

            <div class="row g-4">


                <div class="col-12">

                    <div class="status-card">

                        <div>
                            <h5>Storage Status</h5>

                            <span class="badge bg-success">
                                Active
                            </span>
                        </div>

                        <button class="btn btn-success">
                            Activate
                        </button>

                    </div>

                </div>


                <div class="col-12 col-md-6">

                    <div class="data-card">

                        <div class="data-icon">
                            🌡️
                        </div>

                        <h4>Temperature</h4>

                        <div class="data-value">
                            23°C
                        </div>

                        <p>
                            Current storage temperature
                        </p>

                    </div>

                </div>


                <div class="col-12 col-md-6">

                    <div class="data-card">

                        <div class="data-icon">
                            💧
                        </div>

                        <h4>Humidity</h4>

                        <div class="data-value">
                            45%
                        </div>

                        <p>
                            Current storage humidity
                        </p>

                    </div>

                </div>


                <div class="col-12">

                    <div class="control-card">

                        <div>
                            <h4>Manual Control</h4>

                            <p>
                                Manually control the storage cooling system.
                            </p>
                        </div>

                        <button class="btn btn-primary">
                            Manual Control
                        </button>

                    </div>

                </div>


            </div>

        </div>

    </section>

</main>


<footer class="text-center py-4">

    <p class="mb-0">
        IoT Dashboard
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
