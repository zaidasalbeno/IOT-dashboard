<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IoT Dashboard - Garage</title>

    <link rel="stylesheet" href="../css/garage.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="main.html">
            IoT Dashboard
        </a>

        <a href="main.html" class="btn btn-light">
            ← Back to Home
        </a>

    </div>
</nav>


<main>

    <section class="garage-header">

        <div class="container">

            <h1>Garage</h1>

            <p>
                Monitor parking spaces and garage security.
            </p>

        </div>

    </section>


    <section class="py-5">

        <div class="container">

            <div class="row g-4">


                <div class="col-12">

                    <div class="status-card">

                        <div>
                            <h5>Garage Status</h5>

                            <span class="badge bg-success">
                                3 Parkings Open
                            </span>
                        </div>

                        <button id="act" class="btn btn-success">
                            Activate
                        </button>

                    </div>

                </div>


                <div class="col-12">

                    <div class="movement-card">

                        <div class="movement-icon">
                            🛡️
                        </div>

                        <div>

                            <h3>Security Status</h3>

                            <p class="safe-text">
                                No movement detected
                            </p>

                            <span class="badge bg-success">
                                Area Secure
                            </span>

                        </div>

                    </div>

                </div>


                <div class="col-12 col-md-4">

                    <div class="parking-card">

                        <div class="parking-icon">
                            🚗
                        </div>

                        <h4>Parking 1</h4>

                        <span class="badge bg-success">
                            Open
                        </span>

                    </div>

                </div>


                <div class="col-12 col-md-4">

                    <div class="parking-card">

                        <div class="parking-icon">
                            🚗
                        </div>

                        <h4>Parking 2</h4>

                        <span class="badge bg-success">
                            Open
                        </span>

                    </div>

                </div>


                <div class="col-12 col-md-4">

                    <div class="parking-card">

                        <div class="parking-icon">
                            🚗
                        </div>

                        <h4>Parking 3</h4>

                        <span class="badge bg-success">
                            Open
                        </span>

                    </div>

                </div>


            </div>

        </div>

    </section>

</main>


<footer class="text-center py-4">

    <p class="mb-0">
        IoT Dashboard
    </p>

</footer>

<script src="../js/buttons.js"></script>

<script src="../js/darkmode.js"></script>
</body>
</html>
